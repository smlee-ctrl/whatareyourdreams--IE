<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Exhibition · Dream</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="home">

<main class="screen home">
  <div class="home-hero">
    <div class="home-text">
      <div class="home-nav">
        <span>Exhibition &middot; Dream</span>
        <a href="archive/" aria-label="View public envelope archive">
          <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="1" y="3" width="14" height="10" rx="1" stroke="#000" stroke-width="1"/>
            <path d="M1.5 3.5L8 9L14.5 3.5" stroke="#000" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </div>

      <h1 class="home-title">WHAT DO YOU
HOPE TO ACHIEVE
IN THE FUTURE</h1>

      <p class="home-body">This exhibition allows you to thoughtfully think about why you are pursuing your career.</p>
    </div>

    <!-- mirrors: node 56:289/56:349/56:257 -->
    <img class="home-mirror home-mirror-1" src="assets/mirror-char-06.svg" alt="" aria-hidden="true" />
    <img class="home-mirror home-mirror-2" src="assets/mirror-char-07.svg" alt="" aria-hidden="true" />
    <img class="home-mirror home-mirror-3" src="assets/mirror-char-05.svg" alt="" aria-hidden="true" />
  </div>

  <!-- main character: body/hair/face is one static layer (identical in
       both source files, so it never moves); the hand and eyes are cut out
       from the two source files into their own layers and swap on
       independent timers — only the hand animates for the wave, only the
       eyes animate for the blink. All 5 pieces share the same 260x227
       coordinate space (the character-1-derived pieces are shifted +11px
       to line up with character-2's slightly wider canvas), so they stack
       in perfect alignment with no positioning math needed. -->
  <div class="home-character-rig" role="img" aria-label="An illustrated character waving hello">
    <img class="home-char-layer home-char-base" src="assets/home-char-base.svg" alt="" />
    <div class="home-char-hand-group">
      <img class="home-char-layer home-char-hand home-char-hand-a" src="assets/home-char-hand-a.svg" alt="" />
      <img class="home-char-layer home-char-hand home-char-hand-b" src="assets/home-char-hand-b.svg" alt="" />
    </div>
    <img class="home-char-layer home-char-eyes home-char-eyes-open" src="assets/home-char-eyes-open.svg" alt="" />
    <img class="home-char-layer home-char-eyes home-char-eyes-closed" src="assets/home-char-eyes-closed.svg" alt="" />
  </div>

  <a class="home-cta" href="create/">
    <span>Write your future dream</span>
    <svg viewBox="0 0 29 12" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0 6H28M28 6L22 1M28 6L22 11" stroke="#000" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </a>
</main>

<script src="js/main.js"></script>
</body>
</html>
